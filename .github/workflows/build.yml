name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MiBoxLauncher
    steps:
      - uses: actions/checkout@v4
      - name: ZIP'i aç
        working-directory: .
        run: unzip -q MiBoxLauncher.zip
      - name: Kaynak düzeltmesi
        run: sed -i '/^import androidx.compose.ui.input.key.nativeKeyEvent$/d' app/src/main/java/com/mibox/launcher/ui/Components.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Debug APK
        run: |
          set +e
          gradle --no-daemon --console=plain assembleDebug > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            { grep -E '^e: ' build.log | head -n 25; grep -A8 'What went wrong' build.log | head -n 20; } > errs.txt
            if [ ! -s errs.txt ]; then tail -n 30 build.log > errs.txt; fi
            sed -i 's#file://[^ ]*/mibox/launcher/##' errs.txt
            msg=$(head -c 3500 errs.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Gradle hata ozeti::${msg}"
          fi
          exit $code
      - name: Release APK
        continue-on-error: true
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: MiLauncher-debug-apk
          path: MiBoxLauncher/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiLauncher-release-apk
          path: MiBoxLauncher/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
